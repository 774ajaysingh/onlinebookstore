<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>

    <style>
        body {
            background-color: white;
            font-family: "Times New Roman", serif;
            margin: 10px;
        }

        h1 {
            text-align: center;
            color: blue;
            font-size: 32px;
        }

        .nav {
            text-align: center;
            font-size: 18px;
            margin-bottom: 25px;
        }

        table {
            width: 90%;
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 12px;
            text-align: center;
            font-size: 18px;
        }

        th {
            background-color: lightblue;
        }

        .total {
            width: 90%;
            margin: 20px auto;
            text-align: right;
            font-size: 22px;
            font-weight: bold;
        }

        button {
            padding: 7px 12px;
            cursor: pointer;
            font-size: 15px;
        }

        .remove {
            background-color: lightpink;
        }

        .clear {
            background-color: lightcoral;
        }

        .continue {
            background-color: lightgreen;
        }

        .actions {
            width: 90%;
            margin: 20px auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>ONLINE BOOK STORE - SHOPPING CART</h1>

    <div class="nav">
        <a href="onlinestore.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="registration.html">Registration</a> |
        <a href="catalogue.html">Catalogue</a> |
        <a href="cart.html">Cart</a>
    </div>

    <h2 style="text-align:center;">Your Shopping Cart</h2>

    <table>
        <thead>
            <tr>
                <th>S.No.</th>
                <th>Book Name</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="cartItems">
        </tbody>
    </table>

    <div class="total">
        Total Amount: $<span id="total">0.00</span>
    </div>

    <div class="actions">
        <button class="continue"
                onclick="location.href='catalogue.html'">
            Continue Shopping
        </button>

        <button class="clear" onclick="clearCart()">
            Clear Cart
        </button>
    </div>

    <script>
        function getCart() {
            return JSON.parse(
                localStorage.getItem("bookCart") || "[]"
            );
        }

        function displayCart() {
            let cart = getCart();
            let cartItems = document.getElementById("cartItems");
            let total = 0;

            cartItems.innerHTML = "";

            if (cart.length === 0) {
                cartItems.innerHTML =
                    '<tr><td colspan="4">Your cart is empty.</td></tr>';
            }

            cart.forEach(function(book, index) {
                total += Number(book.price);

                let row = document.createElement("tr");

                let serialCell = document.createElement("td");
                serialCell.textContent = index + 1;

                let nameCell = document.createElement("td");
                nameCell.textContent = book.name;

                let priceCell = document.createElement("td");
                priceCell.textContent =
                    "$" + Number(book.price).toFixed(2);

                let actionCell = document.createElement("td");
                let removeButton = document.createElement("button");

                removeButton.textContent = "Remove";
                removeButton.className = "remove";
                removeButton.onclick = function() {
                    removeItem(index);
                };

                actionCell.appendChild(removeButton);

                row.appendChild(serialCell);
                row.appendChild(nameCell);
                row.appendChild(priceCell);
                row.appendChild(actionCell);

                cartItems.appendChild(row);
            });

            document.getElementById("total").textContent =
                total.toFixed(2);
        }

        function removeItem(index) {
            let cart = getCart();

            cart.splice(index, 1);

            localStorage.setItem(
                "bookCart",
                JSON.stringify(cart)
            );

            displayCart();
        }

        function clearCart() {
            localStorage.removeItem("bookCart");
            displayCart();
        }

        displayCart();
    </script>

</body>
</html>
