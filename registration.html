```html
<!DOCTYPE html>
<html>
<head>
    <title>Registration Page</title>

    <style>
        body {
            background-color: lightpink;
            font-family: "Times New Roman", serif;
        }

        h1 {
            color: blue;
            text-align: center;
        }

        form {
            width: 550px;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid gray;
            border-radius: 10px;
        }

        table {
            width: 100%;
        }

        td {
            padding: 8px;
            font-size: 17px;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        input[type="tel"] {
            width: 220px;
            padding: 5px;
            box-sizing: border-box;
        }

        textarea {
            width: 220px;
            height: 65px;
        }

        .nav {
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
        }

        .buttons {
            text-align: center;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 7px 15px;
            margin: 5px;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>REGISTRATION PAGE</h1>

    <div class="nav">
        <a href="onlinestore.html">Home</a> |
        <a href="login.html">Login</a> |
        <a href="registration.html">Registration</a> |
        <a href="catalogue.html">Catalogue</a> |
        <a href="cart.html">Cart</a>
    </div>

    <form id="registrationForm">

        <table>
            <tr>
                <td><b>Name:</b></td>
                <td>
                    <input type="text" id="name" required>
                </td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td>
                    <input type="password" id="password" required>
                </td>
            </tr>

            <tr>
                <td><b>Email ID:</b></td>
                <td>
                    <input type="email" id="email" required>
                </td>
            </tr>

            <tr>
                <td><b>Phone Number:</b></td>
                <td>
                    <input type="tel" id="phone" maxlength="10" required>
                </td>
            </tr>

            <tr>
                <td><b>Sex:</b></td>
                <td>
                    <input type="radio" name="sex" value="Male" required>
                    Male
                    <input type="radio" name="sex" value="Female">
                    Female
                </td>
            </tr>

            <tr>
                <td><b>Date of Birth:</b></td>
                <td>
                    <select id="day" required>
                        <option value="">Day</option>
                    </select>

                    <select id="month" required>
                        <option value="">Month</option>
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                        <option>May</option>
                        <option>June</option>
                        <option>July</option>
                        <option>August</option>
                        <option>September</option>
                        <option>October</option>
                        <option>November</option>
                        <option>December</option>
                    </select>

                    <select id="year" required>
                        <option value="">Year</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td><b>Languages Known:</b></td>
                <td>
                    <input type="checkbox" name="language" value="English">
                    English<br>

                    <input type="checkbox" name="language" value="Telugu">
                    Telugu<br>

                    <input type="checkbox" name="language" value="Hindi">
                    Hindi<br>

                    <input type="checkbox" name="language" value="Tamil">
                    Tamil
                </td>
            </tr>

            <tr>
                <td><b>Address:</b></td>
                <td>
                    <textarea id="address" required></textarea>
                </td>
            </tr>

            <tr>
                <td colspan="2" class="buttons">
                    <input type="submit" value="Register">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>

        <p id="message" class="error"></p>

    </form>

    <script>
        // Fill the days from 1 to 31
        let day = document.getElementById("day");

        for (let i = 1; i <= 31; i++) {
            let option = document.createElement("option");
            option.value = i;
            option.textContent = i;
            day.appendChild(option);
        }

        // Fill the years
        let year = document.getElementById("year");

        for (let i = 2026; i >= 1950; i--) {
            let option = document.createElement("option");
            option.value = i;
            option.textContent = i;
            year.appendChild(option);
        }

        // Registration form validation
        document.getElementById("registrationForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("name").value.trim();
            let password = document.getElementById("password").value;
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let message = document.getElementById("message");

            message.style.color = "red";

            // Name validation
            if (!/^[A-Za-z ]{6,}$/.test(name)) {
                message.textContent =
                    "Name must contain at least 6 letters and spaces only.";
                return;
            }

            // Password validation
            if (password.length < 6) {
                message.textContent =
                    "Password must contain at least 6 characters.";
                return;
            }

            // Email validation
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                message.textContent =
                    "Please enter a valid email address.";
                return;
            }

            // Phone validation
            if (!/^[0-9]{10}$/.test(phone)) {
                message.textContent =
                    "Phone number must contain exactly 10 digits.";
                return;
            }

            message.style.color = "green";
            message.textContent =
                "Registration form validated successfully!";
        });

    </script>

</body>
</html>
```
